<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Demo — before</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f4f4f5;
      padding: 48px;
    }
    .card {
      max-width: 420px;
      background: #fff;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }
    h1 { font-size: 1.5rem; color: #18181b; margin-bottom: 8px; }
    p { color: #71717a; line-height: 1.5; margin-bottom: 24px; }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome</h1>
    <p>Baseline UI before a theme update.</p>
    <button type="button">Get started</button>
  </div>
</body>
</html>
